<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#64243a"><title>Entre Amigas — carregando</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fbf6ef;color:#64243a;font-family:system-ui,sans-serif}.load{text-align:center;padding:28px}.mark{width:74px;height:74px;border:2px solid #64243a;border-radius:50%;display:grid;place-items:center;margin:0 auto 18px;font:700 26px Georgia,serif;animation:p 1.3s ease-in-out infinite}h1{font:500 32px Georgia,serif;margin:0 0 6px}p{color:#75676b;margin:0}@keyframes p{50%{transform:scale(.94);opacity:.65}}</style></head><body><div class="load"><div class="mark">EA</div><h1>Entre Amigas</h1><p>Preparando a curadoria…</p></div><script>(async()=>{try{const base='https://raw.githubusercontent.com/rodolfoseginfo-tech/exame/entre-amigas-vercel-v211/entre-amigas-v211/';const files=['part-00.b64','part-01.b64','part-02.b64','part-03.b64','part-04.b64'];const parts=await Promise.all(files.map(async f=>{const r=await fetch(base+f,{cache:'no-store'});if(!r.ok)throw new Error('Falha ao carregar '+f);return(await r.text()).trim()}));const arrays=parts.map(s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)));const size=arrays.reduce((n,a)=>n+a.length,0);const all=new Uint8Array(size);let offset=0;for(const a of arrays){all.set(a,offset);offset+=a.length}const html=new TextDecoder('utf-8').decode(all);document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="load"><div class="mark">EA</div><h1>Não foi possível carregar</h1><p>Atualize a página em alguns instantes.</p></div>';console.error(e)}})();</script></body></html>
