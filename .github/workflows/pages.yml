name: Publicar StudySim no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Gerar página estática
        run: |
          npm run start > /tmp/studysim.log 2>&1 &
          SERVER_PID=$!
          for i in {1..30}; do
            if curl --fail --silent http://localhost:3000/ > dist/client/index.html; then break; fi
            sleep 1
          done
          kill $SERVER_PID || true
          test -s dist/client/index.html
          node scripts/prepare-pages.mjs
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
